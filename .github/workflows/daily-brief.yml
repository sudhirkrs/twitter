name: Daily posting brief

# Opens a GitHub issue with a day's posts and one-tap "Open in X" links.
# Watch this repo (or install the GitHub mobile app) to get it as a
# notification. No X API needed.
#
# GitHub has been starting this repo's scheduled runs 5-6 hours late, so
# the issue for a day is created the EVENING BEFORE. The target day is
# "IST now + 6 hours": a run at 19:00 IST, or one delayed until the small
# hours, both prepare the next day. Only the first run creates the issue.
on:
  schedule:
    - cron: "30 13 * * *"  # 19:00 IST, prepares tomorrow
    - cron: "0 15 * * *"   # 20:30 IST, retry
    - cron: "30 0 * * *"   # 06:00 IST, last-chance fallback for today
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python poster.py --check
      - name: Open the next day's issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target=$(TZ=Asia/Kolkata date -d '+6 hours' +%F)
          title="Posts for $(date -d "$target" +'%a %d %b %Y')"
          echo "Target day: $target"
          if gh issue list --label daily-posts --state all --limit 5 --json title --jq '.[].title' | grep -Fxq "$title"; then
            echo "Issue for $target already exists; nothing to do."
            exit 0
          fi
          python brief.py --date "$target" > brief.md
          gh label create daily-posts --color 0F7B5F --force >/dev/null
          # Keep the newest open issue (today's, still needed for the 19:30
          # post) and close anything older.
          for n in $(gh issue list --label daily-posts --state open --json number --jq 'sort_by(.number) | reverse | .[1:] | .[].number'); do
            gh issue close "$n" --comment "Closed: a newer day's brief is out."
          done
          gh issue create --title "$title" --body-file brief.md --label daily-posts --assignee "${{ github.repository_owner }}"
